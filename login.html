<!doctype html>
<html lang="es">
    
<head>        
    <meta charset="utf-8">        
    <title>Iniciar Sesión</title>   
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="author" content="Videojuegos & Desarrollo">
    <meta name="description" content="Ejemplo de formulario de acceso basado en HTML5 y CSS">

    <link href="https://fonts.googleapis.com/css?family=Nunito&display=swap" rel="stylesheet"> 
    
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div id="contenedor">
        
        <div id="contenedorcentrado">
            <div id="login">
                <form id="loginform" action="php/login.php" method="POST">
                    <label for="usuario">Usuario</label>
                    <input id="usuario" type="text" name="usuario" placeholder="Nombre" required>
                    
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" name="password" placeholder="Contraseña" required>

                    <button type="submit" title="Ingresar" name="Ingresar">Iniciar Sesión</button>
                </form>                    
            </div>
            <div id="derecho">
                <div class="titulo">
                    ¡BIENVENIDO A TECNOBIOHEALTH!
                </div>
                <hr>
                <div class="pie-form">                        
                    <a href="registrarse.html">¿No tienes cuenta? Regístrate</a>
                    <hr>
                    <a href="index.html">« Volver</a>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
